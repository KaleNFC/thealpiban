<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
    <title>Yılmaz Alp - IBAN Bilgileri</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: linear-gradient(145deg, #1e293b, #0f172a);
            width: 100%;
            max-width: 380px;
            border-radius: 20px;
            box-shadow: 0 20px 30px rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 28px 20px;
            text-align: center;
        }
        h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 4px;
            color: #ffffff;
            letter-spacing: -0.3px;
        }
        p.subtitle {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 24px;
        }
        .bank-card {
            background: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 18px;
            text-align: left;
            position: relative;
        }
        .bank-name {
            font-size: 13px;
            font-weight: 600;
            color: #38bdf8;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 8px;
        }
        .account-owner {
            font-size: 12px;
            color: #cbd5e1;
            margin-bottom: 10px;
        }
        .iban-number {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 15px;
            font-weight: 600;
            color: #f8fafc;
            word-break: break-all;
            margin-bottom: 16px;
            letter-spacing: 1px;
            text-decoration: none !important;
            border-bottom: none !important;
        }
        /* Telefondaki otomatik link çizgilerini tamamen kaldırma */
        .iban-number a {
            color: inherit !important;
            text-decoration: none !important;
            border: none !important;
            pointer-events: none;
        }
        .copy-btn {
            width: 100%;
            background: #0284c7;
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
        }
        .copy-btn:active {
            transform: scale(0.98);
            background: #0369a1;
        }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #10b981;
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            display: none;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            z-index: 999;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Yılmaz Alp</h1>
        <p class="subtitle">Banka Hesap Bilgileri</p>

        <!-- Banka Kartı -->
        <div class="bank-card">
            <div class="bank-name">HALKBANK</div>
            <div class="account-owner">Alıcı: Yılmaz Alp</div>
            <div class="iban-number" id="iban1">TR31 0001 2009 6380 0009 0083 38</div>
            <button class="copy-btn" onclick="copyIBAN('iban1')">IBAN'ı Kopyala</button>
        </div>
    </div>

    <div id="toast" class="toast">✓ IBAN Kopyalandı</div>

    <script>
        function copyIBAN(elementId) {
            const ibanText = document.getElementById(elementId).innerText.replace(/\s+/g, '');
            navigator.clipboard.writeText(ibanText).then(() => {
                const toast = document.getElementById('toast');
                toast.style.display = 'block';
                setTimeout(() => {
                    toast.style.display = 'none';
                }, 2000);
            });
        }
    </script>
</body>
</html>
