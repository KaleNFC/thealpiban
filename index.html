<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
    <title>Yılmaz Alp - IBAN Bilgileri</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: linear-gradient(135deg, #a60c25, #680514);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            width: 100%;
            max-width: 380px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.18);
            padding: 32px 22px;
            text-align: center;
        }
        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 4px;
            color: #ffffff;
            letter-spacing: -0.3px;
        }
        p.subtitle {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.75);
            margin-bottom: 24px;
        }
        .bank-card {
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 20px;
            text-align: left;
        }
        .bank-name {
            font-size: 14px;
            font-weight: 700;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .account-owner {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 12px;
        }
        .iban-number {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 15px;
            font-weight: 600;
            color: #ffffff;
            word-break: break-all;
            margin-bottom: 18px;
            letter-spacing: 1px;
            text-decoration: none !important;
            border-bottom: none !important;
        }
        .iban-number a {
            color: inherit !important;
            text-decoration: none !important;
            border: none !important;
            pointer-events: none;
        }
        .copy-btn {
            width: 100%;
            background: #ffffff;
            color: #8c0a1e;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
        }
        .copy-btn:active {
            transform: scale(0.97);
            background: #f1f5f9;
        }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #ffffff;
            color: #15803d;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 700;
            display: none;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            z-index: 999;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Yılmaz Alp</h1>
        <p class="subtitle">Banka Hesap Bilgileri</p>

        <!-- Banka Kartı -->
        <div class="bank-card">
            <div class="bank-name">
                <span>Halkbank</span>
            <div class="iban-number" id="iban1">TR31 0001 2009 6380 0009 0083 38</div>
            <button class="copy-btn" onclick="copyIBAN('iban1')">IBAN'ı Kopyala</button>
        </div>
    </div>

    <div id="toast" class="toast">✓ IBAN Panoya Kopyalandı</div>

    <script>
        function copyIBAN(elementId) {
            const ibanText = document.getElementById(elementId).innerText.replace(/\s+/g, '');
            navigator.clipboard.writeText(ibanText).then(() => {
                const toast = document.getElementById('toast');
                toast.style.display = 'block';
                setTimeout(() => {
                    toast.style.display = 'none';
                }, 2000);
            });
        }
    </script>
</body>
</html>
